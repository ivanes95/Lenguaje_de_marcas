<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - DevSolutions</title>
  </head>
  <body>
    <h1>Contacta con DevSolutions</h1>

    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" />

      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" name="apellidos" />

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje"></textarea>

      <button type="submit">Enviar mensaje</button>
    </form>
  </body>
</html>

<!--

Conceptos fundamentales

La relación entre `label` e `input` es muy importante:

<label for="nombre">Nombre:</label>
<input type="text" id="nombre" name="nombre">


El valor de `for` debe coincidir con el `id` del campo.

Además:

`id` identifica el elemento en el documento.
`name` identifica el dato que se enviará al servidor.
`label` proporciona una etiqueta comprensible para el usuario.
`textarea` permite introducir texto de varias líneas.
`button` permite ejecutar una acción.

-->
