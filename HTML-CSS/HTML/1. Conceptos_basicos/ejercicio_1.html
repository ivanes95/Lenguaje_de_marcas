<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mi primera web</title>
  </head>
  <body>
    <h1>Hola, mundo</h1>

    <p>Mi nombre es Ana y esta es mi primera página web.</p>

    <p>
      En este curso espero aprender a crear páginas web utilizando HTML, CSS y
      JavaScript.
    </p>
  </body>
</html>

<!--

Qué deberían identificar los alumnos:

<!DOCTYPE html> → indica que utilizamos HTML5.
<html> → elemento raíz del documento.
<head> → información sobre el documento.
<title> → título que aparece en la pestaña del navegador.
<body> → contenido visible de la página.
<h1> → encabezado principal.
<p> → párrafo.
lang="es" → indica el idioma principal del documento.
charset="UTF-8" → permite utilizar correctamente caracteres como á, ñ, €, etc.

-->
