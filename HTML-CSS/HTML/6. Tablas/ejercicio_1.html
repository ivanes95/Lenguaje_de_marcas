Conceptos trabajados

El alumno aprende la estructura fundamental:

<table>
    <tr>
        <th>Encabezado</th>
        <th>Encabezado</th>
    </tr>

    <tr>
        <td>Dato</td>
        <td>Dato</td>
    </tr>
</table>

Es importante que comprenda la diferencia entre:

<table> → tabla.
<tr> → fila.
<th> → celda de encabezado.
<td> → celda de datos.
