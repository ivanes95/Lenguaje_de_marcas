<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Valencia</title>
  </head>
  <body>
    <h1>Valencia</h1>

    <p>
      Valencia es una ciudad mediterránea conocida por su arquitectura, sus
      playas y su gastronomía.
    </p>

    <img
      src="img/ciudad.jpg"
      alt="Vista de Valencia con la Ciudad de las Artes y las Ciencias"
    />

    <p>
      La ciudad combina espacios históricos con edificios de arquitectura
      contemporánea.
    </p>
  </body>
</html>

<!--

Conceptos importantes

`src` indica **dónde está la imagen**:

src="img/ciudad.jpg"

`alt` proporciona un **texto alternativo**:

alt="Vista de Valencia con la Ciudad de las Artes y las Ciencias"

El `alt` es especialmente importante para accesibilidad. Si la imagen no se puede visualizar, o una persona utiliza un lector de pantalla, ese texto proporciona información sobre la imagen.

No conviene escribir:

alt="imagen"

porque no aporta información útil.

-->
