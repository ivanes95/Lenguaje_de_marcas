<!--

Concepto clave

La diferencia no es simplemente estética.

Esto:
<div class="header">

dice básicamente:

> "Aquí hay un contenedor."

Mientras que:
<header>

comunica:

> "Aquí comienza la cabecera de este contenido."

La segunda opción aporta significado estructural al documento y permite que navegadores, tecnologías de asistencia, buscadores y desarrolladores entiendan mejor la página.

-->
