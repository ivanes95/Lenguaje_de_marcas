<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack tecnológico</title>
  </head>
  <body>
    <h1>Stack tecnológico de TechSolutions</h1>

    <h2>Frontend</h2>

    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>
        Frameworks
        <ul>
          <li>React</li>
          <li>Vue</li>
        </ul>
      </li>
    </ul>

    <h2>Backend</h2>

    <ul>
      <li>Node.js</li>
      <li>Python</li>
      <li>
        Bases de datos
        <ul>
          <li>PostgreSQL</li>
          <li>MongoDB</li>
        </ul>
      </li>
    </ul>

    <h2>DevOps</h2>

    <ul>
      <li>Git</li>
      <li>Docker</li>
      <li>CI/CD</li>
    </ul>
  </body>
</html>

<!--

Punto importante

La lista interior pertenece al elemento de la lista exterior:

<li>
    Frameworks

    <ul>
        <li>React</li>
        <li>Vue</li>
    </ul>
</li>

Esto es importante semánticamente. No se trata simplemente de conseguir una lista "más hacia la derecha".
