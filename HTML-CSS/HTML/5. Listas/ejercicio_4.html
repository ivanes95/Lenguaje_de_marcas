<!--

Punto profesional importante

Una navegación real suele utilizar una estructura como:

<nav>
    <ul>
        <li>
            <a href="...">Enlace</a>
        </li>
    </ul>
</nav>

La lista expresa que las opciones forman un conjunto de elementos relacionados, mientras que nav indica que ese conjunto representa una zona de navegación.

El CSS será el encargado posteriormente de convertir esa lista en un menú horizontal, desplegable, etc.

-->
