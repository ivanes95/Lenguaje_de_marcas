<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - DevSolutions</title>
  </head>
  <body>
    <h1>Contacta con DevSolutions</h1>

    <form>
      <label for="nombre"> Nombre: </label>

      <input type="text" id="nombre" name="nombre" />

      <label for="email"> Email: </label>

      <input type="email" id="email" name="email" required />

      <label for="telefono"> Teléfono: </label>

      <input type="tel" id="telefono" name="telefono" />

      <label for="web"> Página web: </label>

      <input type="url" id="web" name="web" />

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>

<!--

Qué estamos introduciendo

Ahora HTML puede conocer el tipo de información que esperamos:
<input type="email">

no es lo mismo que:
<input type="text">


También:
<input type="url">

indica que esperamos una dirección web.

Y:
<input type="tel">

indica que esperamos un número de teléfono.

Esto permite que el navegador adapte el comportamiento del campo y realice determinadas comprobaciones automáticamente.

-->
