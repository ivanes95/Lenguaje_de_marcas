<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevSolutions | Desarrollo de software</title>

    <meta
      name="description"
      content="DevSolutions desarrolla soluciones de software modernas para empresas y proyectos digitales."
    />
  </head>

  <body>
    <h1>DevSolutions</h1>

    <p>
      Desarrollamos soluciones de software modernas para empresas y proyectos
      digitales.
    </p>
  </body>
</html>

<!--

¿Qué estamos aprendiendo?

`<meta charset="UTF-8">`: permite interpretar correctamente caracteres como `á`, `ñ` o `€`.
`<meta name="viewport">`: adapta la página a dispositivos móviles.
`<title>`: define el título de la página que aparece en la pestaña del navegador y puede utilizarse en los resultados de búsqueda.
`<meta name="description">`: proporciona una descripción de la página que los buscadores pueden utilizar como fragmento del resultado.
`lang="es"`: indica que el contenido está en español.

Importante: la meta descripción no garantiza exactamente el texto que Google mostrará en sus resultados.

-->
