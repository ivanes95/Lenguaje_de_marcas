<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mis sitios favoritos</title>
  </head>
  <body>
    <h1>Mis sitios favoritos</h1>

    <p>Estas son algunas páginas web que utilizo habitualmente.</p>

    <p>
      <a
        href="https://www.google.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Google
      </a>
    </p>

    <p>
      <a
        href="https://es.wikipedia.org"
        target="_blank"
        rel="noopener noreferrer"
      >
        Wikipedia
      </a>
    </p>

    <p>
      <a
        href="https://www.ejemplo.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Página web del centro educativo
      </a>
    </p>
  </body>
</html>

<!--

¿Qué diferencia hay entre estos dos ejemplos?

<a href="https://www.google.com">Google</a>
y:
<a>Google</a>


La primera etiqueta contiene el atributo `href`, que indica el destino del enlace.

La segunda no tiene ningún destino definido.
Visualmente puede parecer un enlace dependiendo de los estilos aplicados, pero no proporciona una navegación funcional.

Conceptos que deben quedar claros

Un atributo tiene normalmente esta estructura:
nombre="valor"

Por ejemplo:
href="https://www.google.com"

Aquí:
href → nombre del atributo.
https://www.google.com → valor del atributo.

Y en:
<a target="_blank">
target es el atributo y _blank es su valor.

-->
