<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas de proyectos</title>
  </head>
  <body>
    <h1>Estadísticas de proyectos</h1>

    <table>
      <caption>
        Métricas actuales de los proyectos de desarrollo
      </caption>

      <thead>
        <tr>
          <th scope="col">Proyecto</th>
          <th scope="col">Desarrolladores</th>
          <th scope="col">Tareas completadas</th>
          <th scope="col">Tareas pendientes</th>
          <th scope="col">Estado</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Web corporativa</td>
          <td>3</td>
          <td>42</td>
          <td>8</td>
          <td>En desarrollo</td>
        </tr>

        <tr>
          <td>App móvil</td>
          <td>5</td>
          <td>87</td>
          <td>13</td>
          <td>En desarrollo</td>
        </tr>

        <tr>
          <td>API REST</td>
          <td>2</td>
          <td>56</td>
          <td>4</td>
          <td>Finalizado</td>
        </tr>

        <tr>
          <td>Dashboard</td>
          <td>4</td>
          <td>31</td>
          <td>12</td>
          <td>En pruebas</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th scope="row">Totales</th>
          <td>14</td>
          <td>216</td>
          <td>37</td>
          <td>—</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>

<!--

Estructura importante

A partir de este ejercicio, el alumno debe empezar a utilizar:

<table>

    <caption>...</caption>

    <thead>
        ...
    </thead>

    <tbody>
        ...
    </tbody>

    <tfoot>
        ...
    </tfoot>

</table>

No es obligatorio utilizar estas cuatro partes en absolutamente todas las tablas, pero sí es una estructura muy útil cuando la tabla representa información compleja.

También aparece:
<th scope="row">Totales</th>

Aquí el encabezado describe una **fila**, no una columna.

-->
