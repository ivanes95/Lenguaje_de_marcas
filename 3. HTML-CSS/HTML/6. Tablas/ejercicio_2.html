<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planes de CloudApp</title>
  </head>
  <body>
    <h1>Planes de CloudApp</h1>

    <table>
      <caption>
        Comparativa de planes de suscripción de CloudApp
      </caption>

      <tr>
        <th scope="col">Plan</th>
        <th scope="col">Precio mensual</th>
        <th scope="col">Usuarios</th>
        <th scope="col">Almacenamiento</th>
        <th scope="col">Soporte</th>
      </tr>

      <tr>
        <td>Starter</td>
        <td>9 €</td>
        <td>2</td>
        <td>10 GB</td>
        <td>Email</td>
      </tr>

      <tr>
        <td>Professional</td>
        <td>29 €</td>
        <td>10</td>
        <td>100 GB</td>
        <td>Email + chat</td>
      </tr>

      <tr>
        <td>Enterprise</td>
        <td>79 €</td>
        <td>Ilimitados</td>
        <td>1 TB</td>
        <td>Prioritario</td>
      </tr>
    </table>
  </body>
</html>

<!--

Conceptos nuevos

Aquí aparece:

<caption>
    Comparativa de planes de suscripción de CloudApp
</caption>

`caption` proporciona un título o descripción de la tabla.

También introducimos:
<th scope="col">

Esto indica que el encabezado corresponde a una columna.

Es especialmente importante para la accesibilidad, ya que ayuda a las tecnologías de asistencia a comprender la relación entre encabezados y datos.

-->
