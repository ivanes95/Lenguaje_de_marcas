<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - CodeAcademy</title>
  </head>
  <body>
    <h1>Crear una cuenta en CodeAcademy</h1>

    <form>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" />

      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" name="apellidos" />

      <label for="usuario">Nombre de usuario:</label>
      <input type="text" id="usuario" name="usuario" />

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" />

      <label for="confirmacion"> Confirmar contraseña: </label>
      <input type="password" id="confirmacion" name="confirmacion" />

      <button type="submit">Registrarse</button>

      <button type="reset">Limpiar formulario</button>
    </form>
  </body>
</html>

<!--

Conceptos nuevos

`type="password"` hace que el contenido introducido no se muestre directamente:

<input type="password">

También aparecen dos tipos importantes de botones:

<button type="submit">Registrarse</button>
<button type="reset">Limpiar formulario</button>

`submit` envía el formulario y `reset` devuelve los controles a su estado inicial.

-->
